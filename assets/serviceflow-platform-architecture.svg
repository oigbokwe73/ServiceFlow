<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">ServiceFlow proposed platform architecture</title><desc id="desc">A layered architecture with experience, platform services, data and synchronization, and a surrounding Playground governance boundary.</desc>
  <defs><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter></defs>
  <rect width="1600" height="950" rx="28" fill="#f8fafc"/><rect x="36" y="36" width="1528" height="878" rx="28" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="14 10"/><text x="70" y="84" font-family="Arial" font-size="18" font-weight="700" fill="#c2410c">PLAYGROUND GOVERNANCE BOUNDARY</text><text x="70" y="124" font-family="Arial" font-size="38" font-weight="700" fill="#172554">ServiceFlow platform blueprint</text><text x="70" y="160" font-family="Arial" font-size="19" fill="#475569">Synthetic data • persona policies • audit • snapshots • reset • export controls</text>
  <g font-family="Arial" filter="url(#sh)">
    <rect x="90" y="205" width="1420" height="170" rx="24" fill="white"/><text x="125" y="250" font-size="20" font-weight="700" fill="#2563eb">EXPERIENCES</text>
    <g fill="#dbeafe"><rect x="125" y="280" width="235" height="58" rx="14"/><rect x="385" y="280" width="235" height="58" rx="14"/><rect x="645" y="280" width="235" height="58" rx="14"/><rect x="905" y="280" width="235" height="58" rx="14"/><rect x="1165" y="280" width="305" height="58" rx="14"/></g>
    <g text-anchor="middle" font-size="18" font-weight="700" fill="#172554"><text x="242" y="316">Service portal</text><text x="502" y="316">Agent workspace</text><text x="762" y="316">Workflow studio</text><text x="1022" y="316">Administration</text><text x="1317" y="316">Reporting + improvement</text></g>
    <rect x="90" y="405" width="1420" height="195" rx="24" fill="#172554"/><text x="125" y="450" font-size="20" font-weight="700" fill="#7dd3fc">SHARED PLATFORM SERVICES</text>
    <g fill="#1e3a8a"><rect x="125" y="480" width="190" height="54" rx="13"/><rect x="335" y="480" width="190" height="54" rx="13"/><rect x="545" y="480" width="190" height="54" rx="13"/><rect x="755" y="480" width="190" height="54" rx="13"/><rect x="965" y="480" width="190" height="54" rx="13"/><rect x="1175" y="480" width="295" height="54" rx="13"/></g>
    <g text-anchor="middle" font-size="16" fill="white"><text x="220" y="513">Identity + profiles</text><text x="430" y="513">Forms + validation</text><text x="640" y="513">Workflow runtime</text><text x="850" y="513">Approval + SLA</text><text x="1060" y="513">Search + knowledge</text><text x="1322" y="513">Audit + notifications + analytics</text></g>
    <text x="125" y="568" font-size="17" fill="#bfdbfe">Reusable APIs and modules keep domain pages consistent, testable, and observable.</text>
    <rect x="90" y="630" width="900" height="210" rx="24" fill="white"/><text x="125" y="675" font-size="20" font-weight="700" fill="#0f766e">DATA + SYNCHRONIZATION</text><rect x="125" y="705" width="245" height="90" rx="15" fill="#ccfbf1"/><rect x="395" y="705" width="245" height="90" rx="15" fill="#ccfbf1"/><rect x="665" y="705" width="285" height="90" rx="15" fill="#ccfbf1"/><g text-anchor="middle" fill="#134e4a"><text x="247" y="743" font-size="18" font-weight="700">Scenario packs</text><text x="247" y="770" font-size="15">versioned JSON</text><text x="517" y="743" font-size="18" font-weight="700">Local profile store</text><text x="517" y="770" font-size="15">drafts + attachments</text><text x="807" y="743" font-size="18" font-weight="700">Optional shared backend</text><text x="807" y="770" font-size="15">explicit conflict-aware sync</text></g>
    <rect x="1020" y="630" width="490" height="210" rx="24" fill="white"/><text x="1055" y="675" font-size="20" font-weight="700" fill="#7c3aed">INTEGRATION BOUNDARY</text><rect x="1055" y="705" width="420" height="90" rx="15" fill="#ede9fe"/><text x="1265" y="742" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">API service + simulation adapters</text><text x="1265" y="772" text-anchor="middle" font-size="15" fill="#6d28d9">server-side credentials • redacted logs</text>
  </g>
</svg>
