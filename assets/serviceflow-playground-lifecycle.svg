<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">ServiceFlow Playground lifecycle</title><desc id="desc">A seven-step loop for selecting a persona, loading a scenario, configuring, simulating, inspecting, exporting, and resetting.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#2563eb"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="700" rx="28" fill="#f8fafc"/><text x="70" y="82" font-family="Arial" font-size="38" font-weight="700" fill="#172554">Learn, inspect, and reset</text><text x="70" y="122" font-family="Arial" font-size="20" fill="#475569">A safe experiment should make both the process and its consequences visible.</text>
  <g stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M275 270H380"/><path d="M570 270H675"/><path d="M865 270H970"/><path d="M1160 270H1265"/><path d="M1360 355V455H1160"/><path d="M970 525H865"/><path d="M675 525H570"/><path d="M380 525H250V355"/></g>
  <g font-family="Arial" filter="url(#s)">
    <g><rect x="85" y="190" width="190" height="165" rx="22" fill="white"/><circle cx="180" cy="235" r="25" fill="#dbeafe"/><text x="180" y="243" text-anchor="middle" font-size="22" fill="#1d4ed8">1</text><text x="180" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#172554">Select persona</text><text x="180" y="323" text-anchor="middle" font-size="16" fill="#64748b">role + objective</text></g>
    <g><rect x="380" y="190" width="190" height="165" rx="22" fill="white"/><circle cx="475" cy="235" r="25" fill="#ccfbf1"/><text x="475" y="243" text-anchor="middle" font-size="22" fill="#0f766e">2</text><text x="475" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#172554">Load scenario</text><text x="475" y="323" text-anchor="middle" font-size="16" fill="#64748b">synthetic snapshot</text></g>
    <g><rect x="675" y="190" width="190" height="165" rx="22" fill="white"/><circle cx="770" cy="235" r="25" fill="#ede9fe"/><text x="770" y="243" text-anchor="middle" font-size="22" fill="#7c3aed">3</text><text x="770" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#172554">Configure</text><text x="770" y="323" text-anchor="middle" font-size="16" fill="#64748b">form + workflow</text></g>
    <g><rect x="970" y="190" width="190" height="165" rx="22" fill="white"/><circle cx="1065" cy="235" r="25" fill="#ffedd5"/><text x="1065" y="243" text-anchor="middle" font-size="22" fill="#c2410c">4</text><text x="1065" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#172554">Simulate</text><text x="1065" y="323" text-anchor="middle" font-size="16" fill="#64748b">run + accelerate</text></g>
    <g><rect x="1265" y="190" width="250" height="165" rx="22" fill="#172554"/><circle cx="1390" cy="235" r="25" fill="#38bdf8"/><text x="1390" y="243" text-anchor="middle" font-size="22" fill="#172554">5</text><text x="1390" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="white">Inspect</text><text x="1390" y="323" text-anchor="middle" font-size="16" fill="#bfdbfe">events + evidence</text></g>
    <g><rect x="970" y="455" width="190" height="140" rx="22" fill="white"/><circle cx="1065" cy="495" r="23" fill="#dcfce7"/><text x="1065" y="503" text-anchor="middle" font-size="20" fill="#15803d">6</text><text x="1065" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#172554">Save / export</text><text x="1065" y="575" text-anchor="middle" font-size="15" fill="#64748b">compare outcomes</text></g>
    <g><rect x="380" y="455" width="190" height="140" rx="22" fill="white"/><circle cx="475" cy="495" r="23" fill="#fee2e2"/><text x="475" y="503" text-anchor="middle" font-size="20" fill="#b91c1c">7</text><text x="475" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#172554">Reset</text><text x="475" y="575" text-anchor="middle" font-size="15" fill="#64748b">restore snapshot</text></g>
  </g>
</svg>
